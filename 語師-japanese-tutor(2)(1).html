<style>
:root {
  --bg: #F2F2F7; --card: #FFFFFF; --primary: #007AFF; --primary-light: rgba(0,122,255,0.08);
  --primary-dark: #0056CC; --green: #34C759; --orange: #FF9500; --purple: #AF52DE;
  --pink: #FF2D55; --teal: #5AC8FA; --yellow: #FFCC00; --red: #FF3B30;
  --text: #1C1C1E; --text2: #3C3C43; --text3: #8E8E93;
  --sep: rgba(60,60,67,0.1); --fill: rgba(120,120,128,0.12);
  --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
  --radius: 14px; --radius-sm: 10px;
  --shadow: 0 1px 3px rgba(0,0,0,0.06);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { height:100%; overflow:hidden; }
body { font-family: var(--font); background: var(--bg); color: var(--text); font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased; }

#app { display: flex; flex-direction: column; height: 100%; padding-top: var(--safe-t); padding-bottom: var(--safe-b); }

/* Header */
.header { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px 6px; background: rgba(242,242,247,0.85); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); z-index: 100; }
.header-title { font-size: 20px; font-weight: 700; letter-spacing: 0.5px; }
.header-title span { font-size: 13px; color: var(--text3); font-weight: 400; margin-left: 6px; }
.header-btns { display: flex; gap: 6px; }
.header-btn { width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: var(--fill); border: none; cursor: pointer; font-size: 16px; transition: background 0.2s; }
.header-btn:active { background: rgba(120,120,128,0.24); }

/* Tabs */
.tabs { display: flex; gap: 6px; padding: 6px 16px 10px; overflow-x: auto; scrollbar-width: none; background: rgba(242,242,247,0.85); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); }
.tabs::-webkit-scrollbar { display:none; }
.tab { flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 7px 12px; border-radius: 20px; border: none; background: var(--card); color: var(--text2); font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.25s ease; box-shadow: var(--shadow); font-family: var(--font); position: relative; }
.tab:active { transform: scale(0.96); }
.tab.active { color: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
.tab[data-mode="qa"].active { background: var(--primary); }
.tab[data-mode="exam"].active { background: var(--orange); }
.tab[data-mode="summary"].active { background: var(--purple); }
.tab[data-mode="learn"].active { background: var(--green); }
.tab[data-mode="review"].active { background: var(--teal); }
.tab-icon { font-size: 14px; }
.tab-badge { position: absolute; top: -4px; right: -4px; min-width: 18px; height: 18px; border-radius: 9px; background: var(--pink); color: #fff; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; padding: 0 4px; }
.tab-badge:empty { display: none; }

/* Chat */
.chat { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 12px 16px 8px; scroll-behavior: smooth; }

/* Welcome */
.welcome { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 24px; text-align: center; }
.welcome-icon { font-size: 56px; margin-bottom: 16px; }
.welcome h2 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
.welcome p { font-size: 14px; color: var(--text3); margin-bottom: 24px; max-width: 280px; }
.welcome-tips { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 340px; }
.welcome-tip { display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: var(--card); border-radius: var(--radius-sm); font-size: 14px; color: var(--text2); cursor: pointer; transition: all 0.2s; box-shadow: var(--shadow); text-align: left; border: none; width: 100%; font-family: var(--font); }
.welcome-tip:active { transform: scale(0.98); background: #f0f0f5; }
.welcome-tip .tip-icon { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }

/* Review Welcome */
.review-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; width: 100%; max-width: 340px; margin-bottom: 20px; }
.review-stat { background: var(--card); border-radius: var(--radius-sm); padding: 14px; text-align: center; box-shadow: var(--shadow); }
.review-stat .num { font-size: 28px; font-weight: 700; color: var(--primary); }
.review-stat .label { font-size: 12px; color: var(--text3); margin-top: 2px; }
.review-stat.due .num { color: var(--pink); }
.review-stat.weak .num { color: var(--orange); }
.review-actions { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 340px; }
.review-action-btn { display: flex; align-items: center; gap: 10px; padding: 14px 16px; background: var(--card); border-radius: var(--radius-sm); font-size: 15px; font-weight: 600; color: var(--text); cursor: pointer; border: none; box-shadow: var(--shadow); transition: all 0.2s; font-family: var(--font); text-align: left; }
.review-action-btn:active { transform: scale(0.98); }
.review-action-btn .ra-icon { font-size: 22px; }
.review-action-btn .ra-count { margin-left: auto; font-size: 13px; color: var(--text3); font-weight: 400; }

/* Review Session */
.review-session { max-width: 400px; margin: 0 auto; }
.review-card { background: var(--card); border-radius: var(--radius); padding: 24px 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); margin-bottom: 16px; }
.review-card-level { display: inline-block; padding: 2px 10px; border-radius: 10px; font-size: 12px; font-weight: 700; color: #fff; margin-bottom: 10px; }
.review-card-pattern { font-size: 26px; font-weight: 700; margin-bottom: 6px; color: var(--text); }
.review-card-reading { font-size: 14px; color: var(--text3); margin-bottom: 12px; }
.review-card-meaning { font-size: 16px; color: var(--text2); margin-bottom: 12px; line-height: 1.5; }
.review-card-formation { font-size: 13px; color: var(--text3); padding: 8px 12px; background: var(--bg); border-radius: 8px; margin-bottom: 12px; }
.review-card-example { font-size: 15px; color: var(--text2); padding: 10px 0; border-top: 1px solid var(--sep); }
.review-card-example .ja { font-weight: 500; margin-bottom: 4px; }
.review-card-example .zh { color: var(--text3); font-size: 14px; }
.review-card-note { font-size: 13px; color: var(--orange); margin-top: 8px; padding: 6px 10px; background: rgba(255,149,0,0.08); border-radius: 6px; }
.review-rating { display: flex; gap: 8px; margin-top: 16px; }
.rating-btn { flex: 1; padding: 14px 8px; border: none; border-radius: var(--radius-sm); font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; font-family: var(--font); }
.rating-btn:active { transform: scale(0.95); }
.rating-btn.again { background: rgba(255,59,48,0.12); color: var(--red); }
.rating-btn.hard { background: rgba(255,149,0,0.12); color: var(--orange); }
.rating-btn.good { background: rgba(52,199,89,0.12); color: var(--green); }
.rating-btn.easy { background: rgba(0,122,255,0.12); color: var(--primary); }
.rating-btn .rb-label { display: block; font-size: 12px; font-weight: 400; color: var(--text3); margin-top: 2px; }
.review-progress { text-align: center; font-size: 13px; color: var(--text3); margin-bottom: 12px; }
.review-done { text-align: center; padding: 40px 20px; }
.review-done .icon { font-size: 56px; margin-bottom: 16px; }
.review-done h3 { font-size: 20px; margin-bottom: 8px; }
.review-done p { font-size: 14px; color: var(--text3); }

/* Messages */
.msg { display: flex; gap: 10px; margin-bottom: 16px; animation: msgIn 0.3s ease; }
.msg.user { flex-direction: row-reverse; }
@keyframes msgIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
.msg-avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; background: var(--fill); }
.msg.user .msg-avatar { background: var(--primary); color: #fff; font-size: 13px; font-weight: 600; }
.msg-bubble { max-width: 82%; padding: 12px 16px; border-radius: var(--radius); font-size: 15px; line-height: 1.65; position: relative; word-wrap: break-word; overflow-wrap: break-word; }
.msg.assistant .msg-bubble { background: var(--card); box-shadow: var(--shadow); border-top-left-radius: 4px; }
.msg.user .msg-bubble { background: var(--primary); color: #fff; border-top-right-radius: 4px; }

/* Knowledge Cards (inline under assistant messages) */
.k-cards { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--sep); }

// ─── FSRS Algorithm ──────────────────────────────────────────
const FSRS = {
  w: [0.4,0.6,2.4,5.8,4.93,0.94,0.86,0.01,1.49,0.14,0.94,2.18,0.05,0.34,1.26,0.29,2.61],
  requestRetention: 0.9,
  DECAY: -0.5,
  FACTOR: 19/81,

  initCard() {
    return { difficulty: 0, stability: 0.4, reps: 0, lapses: 0, lastReview: null, dueDate: Date.now(), rating: 0, history: [] };
  },

  getRetrievable(d, elapsed) {
    if (d.stability <= 0) return 0;
    return Math.pow(1 + (this.FACTOR * elapsed) / (d.stability * 1000 * 86400), this.DECAY);
  },

  getDifficulty(d, rating) {
    const delta = rating - 3;
    const newD = d.difficulty + delta * (-0.04);
    return Math.min(Math.max(newD, 1), 10);
  },

  getStability(d, elapsed, rating) {
    const retrievability = this.getRetrievable(d, elapsed);
    const hardPenalty = rating === 2 ? 0.8 : 1;
    const easyBonus = rating === 4 ? 1.3 : 1;
    let newS;
    if (d.reps === 0) {
      newS = this.w[rating - 1] || 0.4;
    } else {
      const increase = Math.exp(this.w[8]) * (11 - d.difficulty) * Math.pow(d.stability, -this.w[9]) *
        (Math.exp((1 - retrievability) * this.w[10]) - 1) * hardPenalty * easyBonus;
      newS = d.stability * (1 + increase);
    }
    return Math.min(Math.max(newS, 0.1), 36500);
  },

  schedule(card, rating) {
    const now = Date.now();
    const elapsed = card.lastReview ? now - card.lastReview : 0;
    const newD = this.getDifficulty(card, rating);
    const newS = this.getStability(card, elapsed, rating);
    const interval = this.getInterval(newS);
    return {
      difficulty: newD,
      stability: newS,
      reps: rating > 1 ? card.reps + 1 : card.reps,
      lapses: rating === 1 ? card.lapses + 1 : card.lapses,
      lastReview: now,
      dueDate: now + interval * 86400000,
      rating,
      history: [...(card.history || []), { date: now, rating, interval: interval }]
    };
  },

  getInterval(stability) {
    return Math.max(1, Math.round((stability / this.FACTOR) * (Math.pow(this.requestRetention, 1/this.DECAY) - 1)));
  },

  isDue(card) {
    return card.dueDate <= Date.now();
  },

  getDueCount(cards) {
    return Object.values(cards).filter(c => this.isDue(c)).length;
  }
};

  getWeakItems(reviewCards) {
    const items = [];
    for (const [id, card] of Object.entries(reviewCards)) {
      if (!card.history || card.history.length === 0) continue;
      const recent = card.history.slice(-5);
      const avgRating = recent.reduce((s, r) => s + r.rating, 0) / recent.length;
      const againCount = recent.filter(r => r.rating === 1).length;
      if (avgRating < 2.5 || againCount >= 2) {
        const grammar = JLPT_INDEX[id];
        if (grammar) {
          items.push({ id, grammar, avgRating, againCount, reps: card.reps });
        }
      }
    }
    return items.sort((a, b) => a.avgRating - b.avgRating);
  },

  getStats(reviewCards) {
    const total = Object.keys(reviewCards).length;
    const due = FSRS.getDueCount(reviewCards);
    const mastered = Object.values(reviewCards).filter(c => c.reps >= 3 && c.rating >= 3).length;
    const learning = total - mastered;
    return { total, due, mastered, learning };
  }
};

// ─── Knowledge Detector ──────────────────────────────────────
function detectKnowledgeInText(text) {
  const found = [];
  const seen = new Set();
  // Sort by pattern length descending to match longer patterns first
  const sorted = [...JLPT_DB].sort((a, b) => b.pattern.length - a.pattern.length);
  for (const g of sorted) {
    // Extract the core pattern (remove ～ for matching)
    const core = g.pattern.replace(/～/g, '').replace(/[（）()]/g, '');
    if (core.length >= 2 && text.includes(core) && !seen.has(g.id)) {
      seen.add(g.id);
      found.push(g);
    }
    // Also try matching the reading
    const readCore = g.reading.replace(/～/g, '').replace(/[（）()]/g, '');
    if (readCore !== core && readCore.length >= 2 && text.includes(readCore) && !seen.has(g.id)) {
      seen.add(g.id);
      found.push(g);
    }
  }
  return found;
}

// ─── Init ─────────────────────────────────────────────────────
function init() {
  loadState();

  updateInputPlaceholder();
  updateReviewBadge();
  if (!state.apiKey) {
    setTimeout(() => openSettings(), 300);
  }
  renderHistory();
}

function initReviewCards() {
  if (!state.reviewCards) state.reviewCards = {};
  for (const g of JLPT_DB) {
    if (!state.reviewCards[g.id]) {
      state.reviewCards[g.id] = FSRS.initCard();
    }
  }
}

function loadState() {
  try {
    const saved = localStorage.getItem('goshi_state_v2');
    if (saved) {
      const parsed = JSON.parse(saved);
      Object.assign(state, parsed);
    }
  } catch(e) {}
  $('#settingKey').value = state.apiKey || '';
  $('#settingModel').value = state.model || 'deepseek-chat';
  $('#settingApi').value = state.apiBase || 'https://api.deepseek.com';
  updateModeButtons();
}

function updateModeButtons() {
  const normalBtn = $('#modeNormal');

  if (!normalBtn || !deepBtn) return;
  if (state.deepMode) {
    normalBtn.style.background = 'var(--fill)';
    normalBtn.style.color = 'var(--text2)';
    deepBtn.style.background = 'var(--primary)';
    deepBtn.style.color = '#fff';
  } else {
    normalBtn.style.background = 'var(--primary)';
    normalBtn.style.color = '#fff';
    deepBtn.style.background = 'var(--fill)';
    deepBtn.style.color = 'var(--text2)';
  }
}

function saveState() {
  if (!storageAvailable) {
    console.warn('Storage not available, settings will not persist after page reload');
    return false;
  }
  try {
    localStorage.setItem('goshi_state_v2', JSON.stringify({
      conversations: state.conversations,
      currentId: state.currentId,
      apiKey: state.apiKey,
      apiBase: state.apiBase,
      model: state.model,
      mode: state.mode,
      reviewCards: state.reviewCards,
      deepMode: state.deepMode,
    }));
    return true;
  } catch(e) {
    console.warn('Failed to save state:', e);

}

// ─── Events ───────────────────────────────────────────────────
function bindEvents() {
  $('#tabs').addEventListener('click', e => {

    switchMode(tab.dataset.mode);
  });

  inputText.addEventListener('input', () => {

  });

  btnSend.addEventListener('click', () => {
    if (state.generating) { stopGeneration(); return; }
    sendMessage();
  });

  inputText.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      if (!btnSend.disabled) btnSend.click();
    }
  });

  btnImage.addEventListener('click', () => fileInput.click());

  removeImg.addEventListener('click', clearImage);

  $('#btnSettings').addEventListener('click', openSettings);

  $('#saveSettings').addEventListener('click', saveSettings);
  $('#testConnection').addEventListener('click', testApiConnection);
  $('#clearAll').addEventListener('click', clearAllData);
  $('#exportData').addEventListener('click', exportLearningData);

  // Deep mode toggle
  $('#modeNormal').addEventListener('click', () => { state.deepMode = false; updateModeButtons(); saveState(); });
  $('#modeDeep').addEventListener('click', () => { state.deepMode = true; updateModeButtons(); saveState(); });

  $('#btnSidebar').addEventListener('click', openSidebar);
  sidebarOverlay.addEventListener('click', closeSidebar);
  $('#newChat').addEventListener('click', () => { newConversation(); closeSidebar(); });

  $('#btnKB').addEventListener('click', openKnowledgeBase);
  $('#closeKB').addEventListener('click', () => $('#kbModal').classList.remove('show'));
  $('#kbModal').addEventListener('click', e => { if (e.target === $('#kbModal')) $('#kbModal').classList.remove('show'); });

  $('#kDetailModal').addEventListener('click', e => {
    if (e.target === $('#kDetailModal')) $('#kDetailModal').classList.remove('show');
  });

  chat.addEventListener('click', e => {
    const tip = e.target.closest('.welcome-tip');
    if (tip) { inputText.value = tip.dataset.text; inputText.dispatchEvent(new Event('input')); inputText.focus(); return; }
    const bubble = e.target.closest('.msg.assistant .msg-bubble');
    if (bubble) copyMessage(bubble);
    const kchip = e.target.closest('.k-chip');
    if (kchip) { showKnowledgeDetail(kchip.dataset.gid); return; }
    const raBtn = e.target.closest('.review-action-btn');
    if (raBtn) { handleReviewAction(raBtn.dataset.action); return; }
    const ratingBtn = e.target.closest('.rating-btn.rating-btn');
    // Review rating buttons
    const rbtn = e.target > 0 && e.target.closest('[data-rating]');
    if (rbtn) { handleReviewRating(parseInt(rbtn.dataset.rating)); return; }
  });

  // Delegate review rating clicks
  chat.addEventListener('click', e => {
    const rbtn = e.target.closest('[data-rating]');
    if (rbtn) { handleReviewRating(parseInt(rbtn.dataset.rating)); }
  });

  let pressTimer;
  chat.addEventListener('touchstart', e => {
    const bubble = e.target.closest('.msg.assistant .msg-bubble');
    if (!bubble) return;
    pressTimer = setTimeout(() => { copyMessage(bubble); showToast('已复制'); }, 500);
  });
  chat.addEventListener('touchend', () => clearTimeout(pressTimer));
  chat.addEventListener('touchmove', () => clearTimeout(pressTimer));
}

// ─── Mode Switching ───────────────────────────────────────────
function switchMode(mode) {
  state.mode = mode;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.mode === mode));
  modeLabel.textContent = MODE_LABELS[mode];
  updateInputPlaceholder();

  // Show/hide input area for review mode
  if (mode === 'review') {
    inputArea.classList.add('hidden');
    renderReviewWelcome();
  } else {
    inputArea.classList.remove('hidden');
    const convId = Object.keys(state.conversations).find(id => state.conversations[id].mode === mode);
    if (convId) {
      state.currentId = convId;
      renderConversation();
    } else {
      state.currentId = null;
      renderWelcome();
    }
  }
  saveState();
}

function updateInputPlaceholder() {
  const ph = { qa:'输入日语问题…', exam:'输入题目或拍照上传…', summary:'描述需要总结的内容…', learn:'输入学习问题…', review:'' };
  inputText.placeholder = ph[state.mode] || '输入…';
}

function updateReviewBadge() {
  const due = FSRS.getDueCount(state.reviewCards);
  reviewBadge.textContent = due > 0 ? due : '';
}

function newConversation() {
  const id = 'c_' + Date.now();
  state.conversations[id] = { title:'新对话', mode: state.mode, messages:[], createdAt: Date.now() };
  state.currentId = id;
  renderWelcome();

function ensureConversation() {
  if (!state.currentId || !state.conversations[state.currentId]) newConversation();
  const conv = state.conversations[state.currentId];
  if (conv.mode !== state.mode) newConversation();
}

function deleteConversation(id) {
  delete state.conversations[id];
  if (state.currentId === id) { state.currentId = null; renderWelcome(); }
  saveState();
  renderHistory();
}

function switchConversation(id) {
  state.currentId = id;
  const conv = state.conversations[id];
  if (conv) {
    state.mode = conv.mode;
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.mode === conv.mode));
    modeLabel.textContent = MODE_LABELS[conv.mode];

function handleReviewAction(action) {
  let queue = [];
  if (action === 'startDue') {
    queue = Object.entries(state.reviewCards)
      .filter(([id, c]) => FSRS.isDue(c) && c.reps > 0)
      .map(([id]) => id);
  } else if (action === 'startWeak') {
    const weak = WeaknessTracker.getWeakItems(state.reviewCards);
    queue = weak.map(w => w.id);
  } else if (action === 'startAll') {
    queue = Object.keys(state.reviewCards).sort(() => Math.random() - 0.5).slice(0, 20);
  } else if (action === 'backToReview') {
    renderReviewWelcome();
    return;
  }

  if (queue.length === 0) {
    showToast('没有需要复习的卡片');
    return;
  }

  state.reviewSession = { queue, index: 0 };
  renderReviewSession();
}

function handleReviewRating(rating) {
  if (!state.reviewSession) return;
  const session = state.reviewSession;
  if (session.index >= session.queue.length) return;

  const cardId = session.queue[session.index];
  const card = state.reviewCards[cardId];
  if (!card) return;

  // Apply FSRS schedule
  state.reviewCards[cardId] = FSRS.schedule(card, rating);
  saveState();
  updateReviewBadge();

  // Next card
  session.index++;
  renderReviewSession();
}

function renderConversation() {
  const conv = state.conversations[state.currentId];
  if (!conv || conv.messages.length === 0) { renderWelcome(); return; }
  chat.innerHTML = conv.messages.map((m, i) => {
    let html = renderMessage(m);
    // Add knowledge cards after assistant messages
    if (m.role === 'assistant' && m.content) {
      const detected = detectKnowledgeInText(m.content);
      if (detected.length > 0) {
        html += renderKnowledgeCards(detected);
      }
    }
    return html;
  }).join('');
  scrollToBottom();
}

function renderKnowledgeCards(items) {
  return `<div class="k-cards">${items.map(g => {
    const color = JLPT_COLORS[g.level] || 'var(--text3)';
    return `<button class="k-chip" style="background:${color}15;color:${color}" data-gid="${g.id}">
      <span class="k-lvl">${g.level}</span> ${escHtml(g.pattern)}
    </button>`;
  }).join('')}</div>`;
}

function renderMessage(msg) {
  if (msg.role === 'user') {
    let content = '';
    if (msg.image) content += `<img class="msg-image" src="${msg.image}" alt="image">`;
    content += escHtml(msg.content);
    return `<div class="msg user"><div class="msg-avatar">我</div><div class="msg-bubble">${content}</div></div>`;
  } else {
    const html = marked.parse(msg.content || '');
    return `<div class="msg assistant"><div class="msg-avatar">師</div><div class="msg-bubble">${html}</div></div>`;
  }
}

function appendUserMessage(text, imageData) {
  ensureConversation();
  const conv = state.conversations[state.currentId];
  const msg = { role:'user', content: text, image: imageData || null };
  conv.messages.push(msg);
  if (conv.messages.filter(m => m.role === 'user').length === 1) {
    conv.title = text.slice(0, 30) + (text.length > 30 ? '…' : '');
  }
  const div = document.createElement('div');
  div.innerHTML = renderMessage(msg);
  chat.appendChild(div.firstElementChild);
  scrollToBottom();
  saveState();
  renderHistory();
}

function appendAssistantPlaceholder() {
  const div = document.createElement('div');
  div.className = 'msg assistant';
  div.id = 'msg-pending';
  div.innerHTML = `<div class="msg-avatar">師</div><div class="msg-bubble"><div class="typing"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div></div>`;
  chat.appendChild(div);
  scrollToBottom();
}

function updateAssistantBubble(content) {
  const el = document.querySelector('#msg-pending .msg-bubble');
  if (!el) return;
  el.innerHTML = marked.parse(content || '');
  scrollToBottom();
}

function finalizeAssistantBubble(fullContent) {
  const el = document.getElementById('msg-pending');
  if (el) el.id = '';
  // Detect and add knowledge cards
  if (fullContent) {
    const detected = detectKnowledgeInText(fullContent);
    if (detected.length > 0) {
      const cardsDiv = document.createElement('div');
      cardsDiv.innerHTML = renderKnowledgeCards(detected);
      const msgEl = document.querySelector('.msg.assistant:last-child');
      if (msgEl) {
        const bubble = msgEl.querySelector('.msg-bubble');
        if (bubble) bubble.appendChild(cardsDiv.firstElementChild);
      }
    }
  }
}

function scrollToBottom() {
  requestAnimationFrame(() => { chat.scrollTop = chat.scrollHeight; });
}

    </div>
    <div class="k-modal-section">

      <div class="k-modal-section-title">例句</div>

function addToReview(gid) {
  if (!state.reviewCards[gid]) {
    state.reviewCards[gid] = FSRS.initCard();
  }
  saveState();
  updateReviewBadge();
  showKnowledgeDetail(gid); // refresh
  showToast('已加入复习计划');
}

function removeFromReview(gid) {
  if (state.reviewCards[gid]) {
    state.reviewCards[gid].reps = 0;
    state.reviewCards[gid].history = [];
  }
  saveState();
  showKnowledgeDetail(gid); // refresh

// ─── Knowledge Base Browser ───────────────────────────────────
function openKnowledgeBase() {
  renderKBList('all');
  $('#kbModal').classList.add('show');
}

function renderKBList(filter) {
  // Render filter buttons
  const filters = ['all','N5','N4','N3','N2','N1'];
  const filterLabels = { all:'全部', N5:'N5', N4:'N4', N3:'N3', N2:'N2', N1:'N1' };
  $('#kbFilters').innerHTML = filters.map(f =>
    `<button class="tab ${f === filter ? 'active' : ''}" data-kbf="${f}" style="font-size:12px;padding:5px 10px;${f === filter ? 'background:var(--primary);color:#fff;' : 'background:var(--card);'}">${filterLabels[f]}</button>`
  ).join('');

  // Bind filter clicks
  $('#kbFilters').onclick = e => {
    const btn = e.target.closest('[data-kbf]');
    if (btn) renderKBList(btn.dataset.kbf);
  };

  // Filter items
  const items = filter === 'all' ? JLPT_DB : JLPT_DB.filter(g => g.level === filter);

  // Group by level
  const groups = {};
  items.forEach(g => {
    if (!groups[g.level]) groups[g.level] = [];
    groups[g.level].push(g);
  });

  let html = '';
  for (const level of ['N5','N4','N3','N2','N1']) {
    if (!groups[level]) continue;
    const color = JLPT_COLORS[level];
    html += `<div class="kb-level-header" style="color:${color}">${level} (${groups[level].length})</div>`;
    html += groups[level].map(g => {
      const card = state.reviewCards[g.id];
      const status = card && card.reps > 0 ? (card.rating >= 3 ? '✅' : '🔄') : '';
      return `<div class="kb-item" data-gid="${g.id}">
        <div class="kb-item-pattern">${escHtml(g.pattern)}</div>
        <div class="kb-item-meaning">${escHtml(g.meaning)}</div>
        <div class="kb-item-status">${status}</div>
      </div>`;
    }).join('');
  }

  $('#kbList').innerHTML = html;

  // Bind item clicks
  $('#kbList').onclick = e => {
    const item = e.target.closest('.kb-item');
    if (item) {
      $('#kbModal').classList.remove('show');
      showKnowledgeDetail(item.dataset.gid);
    }
  };
}

// ─── Token Estimation ─────────────────────────────────────────
function estimateTokens(text) {
  // Rough estimation: 1 token ≈ 1.5 Chinese chars or 4 English chars
  let tokens = 0;
  for (const char of text) {
    if (/[\u4e00-\u9fff\u3040-\u309f\u30a0-\u30ff]/.test(char)) {
      tokens += 0.67; // CJK characters
    } else if (/[a-zA-Z0-9]/.test(char)) {
      tokens += 0.25; // ASCII letters/numbers
    } else {
      tokens += 0.5; // Punctuation, spaces, etc.
    }
  }
  return Math.ceil(tokens);
}

function updateTokenEstimate(messages) {
  let totalInput = 0;
  for (const msg of messages) {
    if (typeof msg.content === 'string') {
      totalInput += estimateTokens(msg.content);
    } else if (Array.isArray(msg.content)) {
      for (const part of msg.content) {
        if (part.type === 'text') totalInput += estimateTokens(part.text);
        else if (part.type === 'image_url') totalInput += 800; // Images ~800 tokens
      }
    }
  }
  const el = $('#tokenEstimate');
  if (el) {
    el.innerHTML = `输入 ≈ <strong>${totalInput}</strong> tokens | 输出 ≈ <strong>${Math.ceil(totalInput * 0.6)}</strong> tokens (预估)`;
  }
  return totalInput;
}

// ─── Knowledge Injection ──────────────────────────────────────
function injectRelevantKnowledge(userText, convMessages) {
  // Detect grammar points in user's question
  const detected = detectKnowledgeInText(userText);
  if (detected.length === 0) return '';

  // Only inject top 2 most relevant to save tokens
  const relevant = detected.slice(0, 2);
  let injection = '\n\n【参考语法点】\n';
  for (const g of relevant) {
    injection += `- ${g.pattern}（${g.level}）: ${g.meaning}\n`;
    injection += `  接续: ${g.formation}\n`;
    injection += `  例: ${g.example_ja} → ${g.example_zh}\n`;
  }
  return injection;
}

// ─── API Call ─────────────────────────────────────────────────
async function sendMessage() {
  const text = inputText.value.trim();
  const imageData = state.pendingImage;
  if (!text && !imageData) return;
  if (!state.apiKey) { openSettings(); showToast('请先设置 API Key'); return; }

  inputText.value = '';
  inputText.style.height = 'auto';
  btnSend.disabled = true;
  clearImage();

  appendUserMessage(text, imageData);

  const conv = state.conversations[state.currentId];
  // Compress system prompt + inject relevant knowledge
  let systemPrompt = SYSTEM_PROMPTS[state.mode];
  const knowledgeInjection = injectRelevantKnowledge(text, conv.messages);
  if (knowledgeInjection) {
    systemPrompt += knowledgeInjection;
  }
  const apiMessages = [{ role:'system', content: systemPrompt }];

  // History window: 6 messages in normal mode, all in deep mode
  const historyLimit = state.deepMode ? conv.messages.length : 6;
  const history = conv.messages.slice(-historyLimit);
  for (const msg of history) {
    if (msg.role === 'user') {
      if (msg.image) {
        apiMessages.push({ role:'user', content:[
          { type:'text', text: msg.content || '请分析这张图片中的日语题目' },
          { type:'image_url', image_url:{ url: msg.image } }
        ]});
      } else {
        apiMessages.push({ role:'user', content: msg.content });
      }
    } else {
      apiMessages.push({ role:'assistant', content: msg.content });
    }
  }

  appendAssistantPlaceholder();
  state.generating = true;
  btnSend.innerHTML = '⏹';
  btnSend.disabled = false;
  btnSend.classList.add('stop');

  // Update token estimate
  updateTokenEstimate(apiMessages);

  let fullContent = '';
  try {
    state.abortController = new AbortController();
    const resp = await fetch(state.apiBase + '/v1/chat/completions', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + state.apiKey },
      body: JSON.stringify({ model: state.model, messages: apiMessages, stream: true, temperature: 0.7, max_tokens: 4096 }),
      signal: state.abortController.signal,
    });
    if (!resp.ok) {
      const err = await resp.text();
      throw new Error(`API Error ${resp.status}: ${err.slice(0,200)}`);
    }
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';
      for (const line of lines) {
        const trimmed = line.trim();
        if (!trimmed || !trimmed.startsWith('data:')) continue;
        const data = trimmed.slice(5).trim();
        if (data === '[DONE]') continue;
        try {
          const json = JSON.parse(data);
          const delta = json.choices?.[0]?.delta?.content;
          if (delta) { fullContent += delta; updateAssistantBubble(fullContent); }
        } catch(e) {}
      }
    }
  } catch(e) {
    if (e.name === 'AbortError') {
      fullContent += '\n\n---\n*（已停止生成）*';
    } else {
      fullContent = `**错误**：${e.message}\n\n请检查 API Key 和网络设置。`;
    }
    updateAssistantBubble(fullContent);
  }

  if (fullContent) {
    conv.messages.push({ role:'assistant', content: fullContent });
    saveState();
  }
  finalizeAssistantBubble(fullContent);
  state.generating = false;
  state.abortController = null;
  btnSend.innerHTML = '↑';
  btnSend.disabled = !inputText.value.trim();
  btnSend.classList.remove('stop');
}

function stopGeneration() {
  if (state.abortController) state.abortController.abort();
}

// ─── Image Handling ───────────────────────────────────────────
function handleImageSelect(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    state.pendingImage = ev.target.result;
    previewImg.src = ev.target.result;
    imagePreview.classList.add('show');
    btnSend.disabled = false;
    if (state.mode !== 'exam') switchMode('exam');
  };
  reader.readAsDataURL(file);
  fileInput.value = '';
}

function clearImage() {
  state.pendingImage = null;
  imagePreview.classList.remove('show');
  previewImg.src = '';
}

// ─── Settings ─────────────────────────────────────────────────
function openSettings() {
  settingsModal.classList.add('show');
  // Show storage warning if localStorage is not available
  const warning = $('#storageWarning');
  if (warning && !storageAvailable) {
    warning.style.display = 'block';
  }
}
function saveSettings() {
  state.apiKey = $('#settingKey').value.trim();
  state.model = $('#settingModel').value;
  state.apiBase = $('#settingApi').value.trim().replace(/\/$/, '');
  const saved = saveState();
  settingsModal.classList.remove('show');
  if (saved) {
    showToast('已保存');
  } else {
    showToast('已保存（刷新后需重新输入）');
  }
}

async function testApiConnection() {
  const resultEl = $('#testResult');
  const btn = $('#testConnection');
  const apiKey = $('#settingKey').value.trim();
  const apiBase = $('#settingApi').value.trim().replace(/\/$/, '');

  if (!apiKey) {
    resultEl.style.display = 'block';
    resultEl.style.color = 'var(--red)';
    resultEl.innerHTML = '❌ 请先输入 API Key';
    return;
  }

  btn.disabled = true;
  btn.textContent = '⏳ 测试中...';
  resultEl.style.display = 'block';
  resultEl.style.color = 'var(--text2)';
  resultEl.innerHTML = '正在连接 ' + apiBase + ' ...';

  try {
    const resp = await fetch(apiBase + '/v1/models', {
      method: 'GET',
      headers: { 'Authorization': 'Bearer ' + apiKey }
    });

    if (resp.ok) {
      const data = await resp.json();
      resultEl.style.color = 'var(--green)';
      resultEl.innerHTML = '✅ 连接成功！<br>可用模型: ' + (data.data?.length || 0) + ' 个';
    } else {
      const err = await resp.text();
      resultEl.style.color = 'var(--red)';
      resultEl.innerHTML = '❌ API 返回错误 ' + resp.status + '<br>' + err.slice(0, 100);
    }
  } catch (e) {
    resultEl.style.color = 'var(--red)';
    resultEl.innerHTML = '❌ 网络错误<br>' + e.message + '<br><small style="color:var(--text3)">可能原因：无网络/需代理/DNS问题</small>';
  } finally {
    btn.disabled = false;
    btn.textContent = '🔌 测试连接';
  }
}

function clearAllData() {
  if (!confirm('确定清除所有对话记录？此操作不可撤销。')) return;
  state.conversations = {};
  state.currentId = null;
  saveState();
  renderWelcome();
  renderHistory();
  settingsModal.classList.remove('show');
  showToast('已清除');
}

function exportLearningData() {
  const stats = WeaknessTracker.getStats(state.reviewCards);
  const weak = WeaknessTracker.getWeakItems(state.reviewCards);
  const data = {
    exportDate: new Date().toISOString(),
    stats,
    weakItems: weak.map(w => ({
      id: w.id,
      pattern: w.grammar.pattern,
      level: w.grammar.level,
      meaning: w.grammar.meaning,
      avgRating: w.avgRating.toFixed(2),
      againCount: w.againCount,
    })),
    reviewCards: state.reviewCards,
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `goshi_learning_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('学习数据已导出');
}

// ─── Sidebar / History ────────────────────────────────────────
function openSidebar() { renderHistory(); sidebarOverlay.classList.add('show'); sidebar.classList.add('show'); }
function closeSidebar() { sidebarOverlay.classList.remove('show'); sidebar.classList.remove('show'); }
function renderHistory() {
  const convs = Object.entries(state.conversations).sort((a,b) => b[1].createdAt - a[1].createdAt);
  if (convs.length === 0) {
    historyList.innerHTML = '<div style="padding:24px;text-align:center;color:var(--text3);font-size:14px;">暂无对话记录</div>';
    return;
  }
  historyList.innerHTML = convs.map(([id, conv]) => `
    <div class="sidebar-item ${id === state.currentId ? 'active' : ''}" data-id="${id}">
      <button class="sidebar-item-del" data-del="${id}">✕</button>
      <div class="sidebar-item-title">${escHtml(conv.title)}</div>
      <div class="sidebar-item-meta">${MODE_LABELS[conv.mode] || ''} · ${conv.messages.length}条 · ${formatTime(conv.createdAt)}</div>
    </div>
  `).join('');
  historyList.onclick = e => {
    const delBtn = e.target.closest('[data-del]');
    if (delBtn) { e.stopPropagation(); deleteConversation(delBtn.dataset.del); return; }
    const item = e.target.closest('.sidebar-item');
    if (item) switchConversation(item.dataset.id);
  };
}

// ─── Utilities ────────────────────────────────────────────────
function escHtml(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escAttr(s) { return escHtml(s).replace(/"/g,'&quot;'); }

function formatTime(ts) {
  const d = new Date(ts);
  const now = new Date();
  if (d.toDateString() === now.toDateString()) return d.toLocaleTimeString('zh-CN', { hour:'2-digit', minute:'2-digit' });
  return (d.getMonth()+1) + '/' + d.getDate();
}

function showToast(text) {
  toastEl.textContent = text;
  toastEl.classList.add('show');
  setTimeout(() => toastEl.classList.remove('show'), 1500);
}

function copyMessage(bubble) {
  const text = bubble.innerText;
  if (!text) return;
  navigator.clipboard.writeText(text).then(() => showToast('已复制'));
}

// ─── Start ────────────────────────────────────────────────────
init();
